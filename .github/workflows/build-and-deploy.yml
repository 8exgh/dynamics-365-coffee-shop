name: Build and Deploy Coffee Shop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coffee-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and test backend
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Build frontend
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web run build
      - name: Browser workflow checks
        env:
          COFFEE_ADMIN_PASSWORD: browser-test-password
          COFFEE_SESSION_SECRET: browser-test-secret-that-is-32-characters
          COFFEE_DATABASE: /tmp/coffee-browser-test.db
        run: |
          cd web
          npx playwright install --with-deps chromium
          cd ..
          uvicorn app.main:create_app --factory --host 127.0.0.1 --port 3066 > /tmp/coffee-test-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3066/api/health > /dev/null; then break; fi
            sleep 1
          done
          npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coffee-browser-results
          path: |
            web/playwright-report
            artifacts/*.png
  compile-business-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile native extension and native tests
        run: python3 scripts/compile-al.py
      - uses: actions/upload-artifact@v4
        with:
          name: coffee-business-central-apps
          path: artifacts/*.app
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, compile-business-central]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/dynamics-365-coffee-shop" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        id: image
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "reference=$IMAGE@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployment to devops
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ needs.publish.outputs.image }}
          COMMIT: ${{ github.sha }}
        run: |
          test -n "$GH_TOKEN"
          jq -n --arg image "$IMAGE" --arg commit "$COMMIT" '{event_type:"dynamics-365-coffee-shop-deploy",client_payload:{image:$image,commit:$commit}}' > /tmp/coffee-dispatch.json
          gh api --method POST "repos/$OWNER/devops/dispatches" --input /tmp/coffee-dispatch.json
